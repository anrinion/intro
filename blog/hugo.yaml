baseURL: https://anrinion.ansid.de/
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# Only params shared across all locales
params:
  env: production
  keywords: [Blog, Anri, anrinion]
  images: ["/og-default.png"]
  author: anrinion
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  footer:
    text: "No AI-generated content"

  socialIcons:
    - name: bluesky
      url: "https://bsky.app/profile/anrinion.ansid.de"
    - name: github
      url: "https://github.com/anrinion"
    - name: linkedin
      url: "https://www.linkedin.com/in/ansid/"
    - name: telegram
      url: "https://t.me/anrinion"
    - name: email
      url: "mailto:anrinion.web@mail.ansid.de"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

defaultContentLanguage: en
defaultContentLanguageInSubdir: true
disableDefaultLanguageRedirect: false
languages:
  en:
    contentDir: content/en
    label: English
    locale: en-US
    weight: 0

    # Language-specific overrides
    title: Anrinion Nest
    params:
      description: "@anrinion personal blog"
      DateFormat: "January 2, 2006"
      label:
        text: "Home"

      # profile-mode
      profileMode:
        enabled: true # needs to be explicitly set

        subtitle: "Hello there! I'm Anri - a physicist, a software engineer, and a psychology student."
        imageUrl: "/cat.jpg"
        imageWidth: 224
        imageHeight: 124
        imageTitle: A cat
        buttons:
          - name: Read my blog
            url: posts
          - name: Check out projects
            url: projects
    menu:
      main:
        - identifier: posts
          name: posts
          url: /posts/
          weight: 10
        - identifier: projects
          name: projects
          url: /projects/
          weight: 20
        - identifier: about
          name: about me
          url: /about/
          weight: 30

  ru:
    contentDir: content/ru
    label: Русский
    locale: ru-RU
    weight: 1

    # Language-specific overrides
    title: Гнездо Анриниона
    params:
      description: "Блог @anrinion"
      DateFormat: "2 January 2006"
      label:
        text: "Главная"

      # profile-mode
      profileMode:
        enabled: true # needs to be explicitly set

        subtitle: "Привет! Я Анри - физик, разработчик, учусь на психолога."
        imageUrl: "/cat.jpg"
        imageWidth: 224
        imageHeight: 124
        imageTitle: A cat
        buttons:
          - name: Почитать блог
            url: /ru/posts
          - name: Посмотреть проекты
            url: /en/projects
    menu:
      main:
        - identifier: posts (ru)
          name: блог
          url: posts
          weight: 5
        - identifier: posts (en)
          name: блог (англ.)
          url: ../en/posts/
          weight: 10
        - identifier: projects (en)
          name: проекты (англ.)
          url: ../en/projects/
          weight: 20
        - identifier: about (ru)
          name: о себе
          url: about
          weight: 30

baseURL: https://anrinion.ansid.de/
locale: en-us
title: Anrinion’s Nest
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Anrinion’s Nest
  description: "Random stuff from @anrinion"
  keywords: [Blog, Anri, anrinion]
  author: anrinion
  # images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "2 January 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  label:
    text: "Home"

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    subtitle: "Hello there! I'm Anri - a physicist, a software engineer, and a psychology student."
    imageUrl: "/cat.jpg"
    imageWidth: 224
    imageHeight: 124
    imageTitle: A cat
    buttons:
      - name: Read my blog
        url: posts
      - name: Check out projects
        url: projects

  socialIcons:
    - name: bluesky
      url: "https://bsky.app/profile/anrinion.ansid.de"
    - name: github
      url: "https://github.com/anrinion"
    - name: linkedin
      url: "https://www.linkedin.com/in/ansid/"
    - name: telegram
      url: "https://t.me/anrinion"
    - name: email
      url: "mailto:anrinion.web@mail.ansid.de"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/anrinion/intro/blog/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 10
    - identifier: projects
      name: projects
      url: /projects/
      weight: 20
    - identifier: about
      name: about me
      url: /about/
      weight: 30

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
